<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />
  <title>Infinity Life — Support</title>
  <meta name="description" content="Pages de support publiques pour l'application Infinity Life." />
  <style>
    :root { --bg:#0a0a0a; --card:#141416; --border:#26262a; --text:#f4f4f5; --muted:#a1a1aa; --accent:#0a84ff; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.55; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .wrap { max-width:720px; margin:0 auto; padding:48px 20px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:18px; }
    .brand-dot { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#0a84ff 0%,#64d2ff 100%); }
    h1 { font-size:28px; font-weight:900; letter-spacing:-0.4px; margin:24px 0 8px; }
    p { color:var(--muted); font-size:15px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin:20px 0; }
    .card a { display:block; font-weight:700; font-size:16px; }
    .card p { margin:6px 0 0; font-size:13.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="brand-dot"></span><span>Infinity Life</span></div>
    <h1>Support &amp; ressources</h1>
    <p>Pages publiques associées à l'application Infinity Life.</p>

    <div class="card">
      <a href="./delete-account.html">Supprimer mon compte →</a>
      <p>Procédure de suppression du compte et des données personnelles.</p>
    </div>
  </div>
</body>
</html>
